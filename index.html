<script>
// Aplica o tema salvo ANTES da primeira pintura, para não haver "flash" de
// tema claro seguido de escuro. localStorage é usado aqui de propósito (só
// para essa preferência simples de aparência) — os dados financeiros
// continuam inteiramente no IndexedDB, sem relação com isso.
(function () {
  try {
    var tema = localStorage.getItem('mf_tema');
    if (tema === 'escuro') {
      document.documentElement.setAttribute('data-theme', 'escuro');
    }
  } catch (e) {}
})();
</script>
</head>
